# Môi trường local của IVR-Callflow-PBX — chỉ chạy trên máy này, không commit.
#
# Chạy local:   docker compose up            (mở http://localhost:5173)
# Squad dùng:   docker compose -f <file này> --env-file <run_dir>/compose.env -p squad-<slug> \
#                 run --rm <alias> npm test
#   compose.env trỏ <ALIAS>_DIR vào worktree của run; `run` không mở port nên không đụng
#   dev server đang chạy; -p riêng theo slug nên mỗi run một volume node_modules riêng.
#
# Thêm thành phần mới (backend, postgres, …) chỉ khi user xác nhận. Thứ đã có sẵn trên
# server (tổng đài Asterisk, …) KHÔNG dựng ở đây.

name: ivr-callflow-pbx

services:
  frontend:
    # Image Playwright có sẵn Node + Chromium thật cho test e2e.
    # Tag phải khớp đúng phiên bản @playwright/test trong package-lock.json.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - ${FRONTEND_DIR:-./frontend}:/app
      - frontend_node_modules:/app/node_modules # node_modules Linux, không lẫn bản Windows
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  frontend_node_modules:
